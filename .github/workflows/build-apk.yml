name: Build AIDEL TV APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir -p android-project
          # Support both possible zip names
          if [ -f AIDEL-TV-Android-Project.zip ]; then
            unzip -o AIDEL-TV-Android-Project.zip -d android-project
          elif [ -f AIDEL-TV-Android-Project-1.zip ]; then
            unzip -o AIDEL-TV-Android-Project-1.zip -d android-project
          else
            echo "ERROR: No Android project zip found!"
            ls -la
            exit 1
          fi
          echo "=== Extracted files ==="
          find android-project -type f | sort

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: |
          cd android-project
          chmod +x gradlew || true
          ls -l gradlew

      - name: Build Debug APK
        run: |
          cd android-project
          ./gradlew assembleDebug --stacktrace --info

      - name: List APK output
        run: |
          find android-project -name "*.apk" -type f

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AIDEL-TV-APK
          path: android-project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
