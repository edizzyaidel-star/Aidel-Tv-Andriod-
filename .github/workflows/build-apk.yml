name: Build AIDEL TV APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir -p android-project
          unzip -o AIDEL-TV-Android-Project-1.zip -d android-project

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          # Go into the extracted project
          cd android-project

          # Find the real project root (in case the zip has a subfolder)
          if [ -f "gradlew" ]; then
            PROJECT_DIR="."
          else
            PROJECT_DIR=$(find . -name "gradlew" -type f | head -n 1 | xargs dirname)
          fi

          echo "Building from: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          # Make gradlew executable and build
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AIDEL-TV-APK
          path: android-project/**/build/outputs/apk/debug/*.apk
